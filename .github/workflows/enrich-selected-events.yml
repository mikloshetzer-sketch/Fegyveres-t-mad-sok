name: Enrich Selected Events

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  biweekly-intelligence-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify live attack data
        run: |
          test -f docs/data/attacks_2026_live.geojson
          ls -lh docs/data/attacks_2026_live.geojson

      - name: Refine attack events
        run: |
          python scripts/refine_attack_events.py

      - name: Verify refined attack data
        run: |
          test -f docs/data/attacks_2026_refined.geojson
          test -f docs/data/attacks_2026_refined_audit.json
          ls -lh docs/data/attacks_2026_refined.geojson
          ls -lh docs/data/attacks_2026_refined_audit.json

      - name: Generate biweekly report
        run: |
          python scripts/generate_biweekly_report.py

      - name: Verify selected events
        run: |
          ls -R docs/reports/biweekly/selected-events
          test -f docs/reports/biweekly/selected-events/latest-selected-events.json

      - name: Run Local Media Enrichment
        run: |
          python scripts/enrich_selected_events_local_media.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/attacks_2026_refined.geojson
          git add docs/data/attacks_2026_refined_audit.json
          git add docs/reports/biweekly/
          git add docs/reports/biweekly/enrichment/

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update biweekly intelligence pipeline"
            git push
          fi

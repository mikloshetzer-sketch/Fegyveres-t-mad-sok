name: Biweekly Intelligence Pipeline

on:
  workflow_dispatch:

  schedule:
    # Minden hétfő 05:20 UTC
    - cron: "20 5 * * 1"

permissions:
  contents: write

jobs:
  biweekly-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify LIVE attack database
        run: |
          echo "Checking attacks_2026_live.geojson..."

          test -f docs/data/attacks_2026_live.geojson

          python - <<'PY'
          import json

          with open("docs/data/attacks_2026_live.geojson","r",encoding="utf-8") as f:
              data=json.load(f)

          features=len(data.get("features",[]))

          print(f"LIVE events: {features}")

          if features==0:
              raise SystemExit("No LIVE events found.")
          PY

      - name: Generate biweekly report
        run: |
          python scripts/generate_biweekly_report.py

      - name: Verify selected events
        run: |
          test -f docs/reports/biweekly/selected-events/latest-selected-events.json

          python - <<'PY'
          import json

          with open("docs/reports/biweekly/selected-events/latest-selected-events.json","r",encoding="utf-8") as f:
              data=json.load(f)

          total=0

          if isinstance(data,dict):
              if "regions" in data:
                  regions=data.get("regions",{})
                  if isinstance(regions,dict):
                      for r in regions.values():
                          total+=int(r.get("selected_count",0))
                  elif isinstance(regions,list):
                      for r in regions:
                          total+=len(r.get("events",[]))
              elif "events" in data:
                  total=len(data["events"])

          print(f"Selected events: {total}")

          if total==0:
              raise SystemExit("No selected events generated.")
          PY

      - name: Run Local Media enrichment
        run: |
          python scripts/enrich_selected_events_local_media.py

      - name: Verify enrichment output
        run: |
          ls -R docs/reports/biweekly/enrichment/ || true

      - name: Create pipeline status
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          status={
              "generated_at":datetime.now(timezone.utc).isoformat(),
              "status":"ok",
              "pipeline":[
                  "live verified",
                  "biweekly report",
                  "selected events",
                  "local media"
              ]
          }

          with open("docs/reports/biweekly/pipeline-status.json","w",encoding="utf-8") as f:
              json.dump(status,f,indent=2,ensure_ascii=False)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/reports/biweekly/

          if [ -f docs/data/attacks_2026_refined.geojson ]; then
            git add docs/data/attacks_2026_refined.geojson
          fi

          if [ -f docs/data/attacks_2026_refined_audit.json ]; then
            git add docs/data/attacks_2026_refined_audit.json
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update biweekly intelligence pipeline"
            git pull --rebase origin main
            git push origin main
          fi

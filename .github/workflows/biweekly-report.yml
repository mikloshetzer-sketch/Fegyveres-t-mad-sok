name: Biweekly Intelligence Pipeline

on:
  workflow_dispatch:

  schedule:
    # Every Monday 05:20 UTC
    - cron: "20 5 * * 1"

permissions:
  contents: write

jobs:
  biweekly-intelligence:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      ####################################################################
      # Checkout
      ####################################################################

      - name: Checkout repository
        uses: actions/checkout@v4

      ####################################################################
      # Python
      ####################################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      ####################################################################
      # Verify LIVE database
      ####################################################################

      - name: Verify LIVE attack database
        run: |

          test -f docs/data/attacks_2026_live.geojson

          python - <<'PY'
          import json

          with open("docs/data/attacks_2026_live.geojson","r",encoding="utf-8") as f:
              data=json.load(f)

          count=len(data.get("features",[]))

          print(f"LIVE events: {count}")

          if count==0:
              raise SystemExit("Live database is empty.")
          PY

      ####################################################################
      # Generate report
      ####################################################################

      - name: Generate biweekly report
        run: |
          python scripts/generate_biweekly_report.py

      ####################################################################
      # Verify selected events
      ####################################################################

      - name: Verify selected events
        run: |

          test -f docs/reports/biweekly/selected-events/latest-selected-events.json

          python - <<'PY'
          import json

          with open(
              "docs/reports/biweekly/selected-events/latest-selected-events.json",
              "r",
              encoding="utf-8"
          ) as f:
              data=json.load(f)

          events=data.get("events",[])

          print(f"Selected events: {len(events)}")

          if len(events)==0:
              raise SystemExit("No selected events generated.")
          PY

      ####################################################################
      # Refine selected events
      ####################################################################

      - name: Refine selected events
        run: |
          python scripts/refine_attack_events.py

      ####################################################################
      # Verify refinement
      ####################################################################

      - name: Verify refinement
        run: |

          test -f docs/reports/biweekly/selected-events/latest-selected-events-refined.json

          test -f docs/reports/biweekly/selected-events/latest-selected-events-refinement-audit.json

      ####################################################################
      # Local Media
      ####################################################################

      - name: Run Local Media enrichment
        run: |
          python scripts/enrich_selected_events_local_media.py

      ####################################################################
      # Verify enrichment
      ####################################################################

      - name: Verify enrichment output
        run: |

          ls -R docs/reports/biweekly/enrichment/

      ####################################################################
      # Pipeline status
      ####################################################################

      - name: Create pipeline status
        run: |

          python - <<'PY'

          import json
          from datetime import datetime

          status={
              "generated_at":datetime.utcnow().isoformat()+"Z",
              "status":"ok",
              "steps":[
                  "live database verified",
                  "biweekly report generated",
                  "selected events verified",
                  "selected events refined",
                  "local media enrichment"
              ]
          }

          with open(
              "docs/reports/biweekly/pipeline-status.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(status,f,indent=2)

          PY

      ####################################################################
      # Commit
      ####################################################################

      - name: Commit changes
        run: |

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/reports/biweekly/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update biweekly intelligence pipeline"
            git push
          fi

name: Biweekly Intelligence Pipeline

on:
  workflow_dispatch:

  schedule:
    # Minden hétfő 05:20 UTC
    - cron: "20 5 * * 1"

permissions:
  contents: write

jobs:
  biweekly-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify LIVE attack database
        run: |
          echo "Checking docs/data/attacks_2026_live.geojson..."

          test -f docs/data/attacks_2026_live.geojson

          python - <<'PY'
          import json

          with open("docs/data/attacks_2026_live.geojson","r",encoding="utf-8") as f:
              data=json.load(f)

          features=len(data.get("features",[]))
          print(f"LIVE events: {features}")

          if features==0:
              raise SystemExit("No LIVE events found.")
          PY

      - name: Refine attack events
        run: |
          python scripts/refine_attack_events.py

      - name: Verify refined dataset
        run: |
          echo "Checking refined files..."

          if [ ! -f docs/data/attacks_2026_refined.geojson ]; then
            echo "Missing: docs/data/attacks_2026_refined.geojson"
            echo "docs/data content:"
            ls -la docs/data/
            exit 1
          fi

          if [ ! -f docs/data/attacks_2026_refined_audit.json ]; then
            echo "Missing: docs/data/attacks_2026_refined_audit.json"
            echo "docs/data content:"
            ls -la docs/data/
            exit 1
          fi

          python - <<'PY'
          import json

          with open("docs/data/attacks_2026_refined.geojson","r",encoding="utf-8") as f:
              data=json.load(f)

          features=len(data.get("features",[]))
          print(f"Refined events: {features}")

          if features==0:
              raise SystemExit("Refined dataset is empty.")
          PY

      - name: Generate biweekly report
        run: |
          python scripts/generate_biweekly_report.py

      - name: Enrich selected events analysis
        run: |
          python scripts/enrich_selected_events_analysis.py

      - name: Verify selected events and analysis
        run: |
          test -f docs/reports/biweekly/selected-events/latest-selected-events.json
          test -f docs/reports/biweekly/selected-events/latest-selected-events-analysis-audit.json

          python - <<'PY'
          import json

          path="docs/reports/biweekly/selected-events/latest-selected-events.json"

          with open(path,"r",encoding="utf-8") as f:
              data=json.load(f)

          events=data.get("events",[])
          analysis_count=sum(1 for e in events if isinstance(e,dict) and e.get("analysis"))

          print(f"Selected events: {len(events)}")
          print(f"Events with analysis: {analysis_count}")

          if len(events)==0:
              raise SystemExit("No selected events generated.")

          if analysis_count==0:
              raise SystemExit("No event analysis blocks generated.")
          PY

      - name: Run Local Media enrichment
        run: |
          python scripts/enrich_selected_events_local_media.py

      - name: Verify enrichment output
        run: |
          ls -R docs/reports/biweekly/enrichment/

      - name: Create pipeline status
        run: |
          python - <<'PY'
          import json
          from datetime import datetime

          status={
              "generated_at":datetime.utcnow().isoformat()+"Z",
              "status":"ok",
              "pipeline":[
                  "live verified",
                  "refined",
                  "biweekly report",
                  "selected events",
                  "event analysis",
                  "local media"
              ]
          }

          with open("docs/reports/biweekly/pipeline-status.json","w",encoding="utf-8") as f:
              json.dump(status,f,indent=2,ensure_ascii=False)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/attacks_2026_refined.geojson
          git add docs/data/attacks_2026_refined_audit.json
          git add docs/reports/biweekly/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update biweekly intelligence pipeline"
            git pull --rebase origin main
            git push
          fi
